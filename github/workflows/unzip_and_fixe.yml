name: Unzip & Fix Project Structure

on:
  workflow_dispatch: # يسمح لك بتشغيل هذا الملف يدوياً من زر Actions

permissions:
  contents: write

jobs:
  unzip-and-organize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Unzip Archive
        run: |
          # البحث عن أي ملف مضغوط
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found!"
            exit 0
          fi
          
          echo "Found zip file: $ZIP_FILE"
          
          # فك الضغط
          unzip -o "$ZIP_FILE"
          
          # حذف الملف المضغوط الأصلي لتنظيف المساحة
          rm "$ZIP_FILE"
          
          # نقل الملفات إذا كانت داخل مجلد فرعي (مشكلة شائعة عند الضغط)
          # إذا كان هناك مجلد واحد فقط بعد فك الضغط، انقل محتوياته للخارج
          DIR_COUNT=$(ls -d */ | wc -l)
          if [ "$DIR_COUNT" -eq "1" ]; then
            SINGLE_DIR=$(ls -d */ | head -n 1)
            echo "Moving files from $SINGLE_DIR to root..."
            mv "$SINGLE_DIR"* .
            mv "$SINGLE_DIR".* . 2>/dev/null || true
            rmdir "$SINGLE_DIR"
          fi

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add .
          git commit -m "Auto-unzip project files" || echo "No changes to commit"
          git push
